[project]
name = "vc-simulation-backend"
version = "0.1.0"
description = "FastAPI backend for VC-aligned simulation scene, topology, and runtime state basics."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "networkx>=3.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "simpy>=4.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "markdown-it-py>=3.0",
  "redis>=5.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
